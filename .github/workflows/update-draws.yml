name: Update Lotto Draws

on:
  schedule:
    # 토요일 추첨(20:35 KST) 이후: 토 23:00 KST, 놓친 경우 일 09:00 KST 재시도
    - cron: '0 14 * * 6'
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-draws
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 스크립트는 Node 내장 모듈만 사용하므로 의존성 설치가 필요 없음
      - name: Fetch new draws
        run: node scripts/fetch-draws.mjs

      - name: Commit updated data
        run: |
          if git diff --quiet -- public/data/draws.json; then
            echo "No new draws"
            exit 0
          fi
          latest=$(node -p "require('./public/data/draws.json').latest")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/draws.json
          git commit -m "chore: 로또 ${latest}회 당첨번호 업데이트"
          git push
